# Release (DECISIONS.md "Releases"): builds the packages from main and attaches them to a draft GitHub
# Release, which the owner publishes by hand after checking it.
#
# Started by hand only (owner CI rule, ~/.claude/CLAUDE.md): the full suite already ran on the pull request
# into main (ci.yml), so this builds, packages and smoke-tests the packaged plugins with pluginval, and runs
# nothing else. Signing and notarisation run only when their secrets exist; without them the packages are
# unsigned (macOS bundles are signed ad hoc by tools/package/macos.sh).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (X.Y.Z; must equal project(VJN6 VERSION), the plugin VERSION and package.json)
        required: true
      prerelease:
        description: Mark as a pre-release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  # pluginval (GPL-3) is downloaded at run time as a separate tool into the runner's temporary directory;
  # it is never committed, linked or shipped (R-L2).
  PLUGINVAL_VERSION: v1.0.4
  # The WebView2 SDK package JUCE links statically on Windows (NEEDS_WEBVIEW2).
  WEBVIEW2_VERSION: 1.0.3485.44
  VERSION: ${{ inputs.version }}

jobs:
  check:
    name: Branch, version and tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "::error::Release from main only (got $GITHUB_REF)"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must be X.Y.Z (got $VERSION)"; exit 1; }
          root=$(sed -nE 's/^project\(VJN6 VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          plugin=$(sed -nE 's/.*PRODUCT_NAME "VJN6".* VERSION ([0-9.]+).*/\1/p' plugin/CMakeLists.txt)
          npm_root=$(sed -nE 's/^  "version": "([0-9.]+)",$/\1/p' package.json)
          npm_ui=$(sed -nE 's/^  "version": "([0-9.]+)",$/\1/p' ui/package.json)
          for v in "$root" "$plugin" "$npm_root" "$npm_ui"; do
            if [[ "$v" != "$VERSION" ]]; then
              echo "::error::$VERSION does not match CMakeLists.txt ($root), plugin/CMakeLists.txt ($plugin), package.json ($npm_root) and ui/package.json ($npm_ui)"
              exit 1
            fi
          done
          if gh release view "v$VERSION" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION already exists"; exit 1
          fi

  package:
    name: Package ${{ matrix.name }}
    needs: check
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-15
          - name: Windows x64
            os: windows-2022
          - name: Linux x64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    env:
      ART: build/plugin/VJN6_artefacts/Release
      # Signing and notarisation run only when these secrets exist.
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build xvfb \
            libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libxi-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libegl-dev libglu1-mesa-dev mesa-common-dev

      - name: WebView2 SDK and Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: |
          dir="${RUNNER_TEMP//\\//}/webview2"
          nuget install Microsoft.Web.WebView2 -Version "$WEBVIEW2_VERSION" -OutputDirectory "$dir" -NonInteractive
          echo "WEBVIEW2_DIR=$dir" >> "$GITHUB_ENV"
          if [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ] && [ ! -f "/c/Program Files/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup -y --no-progress
          fi

      - name: Download pluginval (separate GPL-3 tool, never in the repository or the packages)
        run: |
          case "$RUNNER_OS" in
            macOS)   asset=pluginval_macOS.zip;   exe=pluginval.app/Contents/MacOS/pluginval ;;
            Windows) asset=pluginval_Windows.zip; exe=pluginval.exe ;;
            Linux)   asset=pluginval_Linux.zip;   exe=pluginval ;;
          esac
          dir="$RUNNER_TEMP/pluginval"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/pluginval.zip" \
            "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/$asset"
          (cd "$dir" && cmake -E tar xf pluginval.zip)
          chmod +x "$dir/$exe" || true
          echo "PLUGINVAL=$dir/$exe" >> "$GITHUB_ENV"

      - name: Build the UI bundle (ui/dist, served by the plugin editor)
        run: |
          npm ci
          npm run build

      - name: Configure
        run: |
          args=(-DVJN6_BUILD_PLUGIN=ON -DVJN6_BUILD_TESTS=OFF -DVJN6_BUILD_WEB=OFF)
          case "$RUNNER_OS" in
            macOS)   args+=(-G Xcode "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64") ;;
            Windows) args+=(-G "Visual Studio 17 2022" -A x64 "-DJUCE_WEBVIEW2_PACKAGE_LOCATION=$WEBVIEW2_DIR") ;;
            Linux)   args+=(-G Ninja -DCMAKE_BUILD_TYPE=Release) ;;
          esac
          cmake -S . -B build "${args[@]}"

      - name: Build (Standalone, VST3, AU on macOS)
        run: cmake --build build --config Release --parallel

      - name: Built artefacts
        run: |
          ls -la "$ART" "$ART/Standalone" "$ART/VST3"
          if [ "$RUNNER_OS" = macOS ]; then
            for b in "$ART/Standalone/VJN6.app/Contents/MacOS/VJN6" "$ART/VST3/VJN6.vst3/Contents/MacOS/VJN6" \
                     "$ART/AU/VJN6.component/Contents/MacOS/VJN6"; do
              archs=$(lipo -archs "$b")
              [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]] || { echo "::error::$b is not universal: $archs"; exit 1; }
              # the installer promises macOS 13+, so every slice must run there
              for arch in arm64 x86_64; do
                minos=$(otool -arch "$arch" -l "$b" | awk '/LC_BUILD_VERSION/ {f = 1} f && $1 == "minos" {print $2; exit}')
                echo "$b ($arch): minos $minos"
                [ "$minos" = 13.0 ] || { echo "::error::$b ($arch) needs macOS $minos, not 13.0"; exit 1; }
              done
            done
          fi

      - name: Licence notices into the bundles
        run: |
          extra=()
          if [ "$RUNNER_OS" = Windows ]; then
            lic=$(find "$WEBVIEW2_DIR/Microsoft.Web.WebView2.$WEBVIEW2_VERSION" -maxdepth 1 -iname 'LICENSE*' | head -n 1)
            [ -n "$lic" ] || { echo "::error::WebView2 SDK licence file not found"; exit 1; }
            extra=(--webview2-license "$lic")
          fi
          python tools/package/notices.py --install "$ART" ${extra[@]+"${extra[@]}"}

      - name: Sign (macOS, Developer ID; only when the secrets exist)
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/vjn6-signing.keychain-db"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          # the existing search list stays behind the new keychain, one word per keychain
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          code="$(dirname "$ART")/JuceLibraryCode"
          for pair in "Standalone/VJN6.app:VJN6_Standalone" "VST3/VJN6.vst3:VJN6_VST3" "AU/VJN6.component:VJN6_AU"; do
            bundle="$ART/${pair%%:*}"
            ent="$code/${pair##*:}.entitlements"
            extra=()
            [ -f "$ent" ] && extra=(--entitlements "$ent")
            codesign --force --timestamp --options runtime "${extra[@]}" --sign "$MACOS_SIGNING_IDENTITY" "$bundle"
            codesign --verify --strict --verbose=2 "$bundle"
          done

      - name: Notarise and staple (macOS; only when the secrets exist)
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_P12 != '' && env.APPLE_ID != ''
        run: |
          for b in Standalone/VJN6.app VST3/VJN6.vst3 AU/VJN6.component; do
            bundle="$ART/$b"
            zip="$RUNNER_TEMP/$(basename "$bundle").zip"
            ditto -c -k --keepParent "$bundle" "$zip"
            xcrun notarytool submit "$zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$bundle"
          done

      - name: Sign (Windows, Authenticode; only when the secrets exist)
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE_PFX != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          $files = @(
            (Join-Path $env:ART 'Standalone\VJN6.exe'),
            (Join-Path $env:ART 'VST3\VJN6.vst3\Contents\x86_64-win\VJN6.vst3'))
          foreach ($f in $files) {
            & $signtool.FullName sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 `
              /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD $f
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Remove-Item $pfx

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: tools/package/macos.sh "$ART" "$VERSION" dist

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/package/windows.ps1 -Artefacts $env:ART -Version $env:VERSION -Out dist

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tools/package/linux.sh "$ART" "$VERSION" dist

      - name: Smoke test, pluginval strictness 5 on the packaged VST3
        run: |
          cmd=("$PLUGINVAL" --strictness-level 5 --validate-in-process --timeout-ms 300000 --validate "$ART/VST3/VJN6.vst3")
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1920x1080x24" "${cmd[@]}"
          else
            "${cmd[@]}"
          fi

      - name: Smoke test, pluginval strictness 5 on the packaged AU (macOS)
        if: runner.os == 'macOS'
        run: |
          au="$HOME/Library/Audio/Plug-Ins/Components/VJN6.component"
          rm -rf "$au" && ditto "$ART/AU/VJN6.component" "$au"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          "$PLUGINVAL" --strictness-level 5 --validate-in-process --timeout-ms 300000 --validate "$au"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft GitHub Release
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          cat > notes.md <<EOF
          VJN6 $VERSION, a six-voice virtual-analog synthesizer: standalone app and plugins for macOS 13+ (universal: Standalone, VST3, AU), Windows 10 22H2+/11 x64 (Standalone, VST3) and Ubuntu 24.04 x64 (Standalone, VST3).

          | File | Contents |
          | --- | --- |
          | \`VJN6-$VERSION-macOS.pkg\` | Installer: app, VST3, AU |
          | \`VJN6-$VERSION-Windows-x64-Setup.exe\` | Installer: app, VST3 |
          | \`VJN6-$VERSION-Windows-x64.zip\` | The same files, to copy by hand |
          | \`VJN6-$VERSION-Linux-x64.tar.gz\` | App and VST3, with INSTALL.txt |
          | \`SHA256SUMS\` | Checksums |

          **These builds are not code-signed.** macOS blocks the installer the first time and Windows SmartScreen warns; [Install a release](https://github.com/${GITHUB_REPOSITORY}/blob/main/README.md#install-a-release) has the steps.
          EOF
          flags=(--draft --target "$GITHUB_SHA" --title "VJN6 $VERSION" --notes-file notes.md)
          [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          gh release create "v$VERSION" dist/* "${flags[@]}" --repo "$GITHUB_REPOSITORY"
